<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>案C マタンが案内する</title><link rel="stylesheet" href="common.css">
<style>
  .wrap { max-width:1120px; margin:0 auto; padding:22px 20px 84px; }
  .top { text-align:center; margin-bottom:18px; }
  .top h1 { font-size:.85rem; color:#ffcc4d; letter-spacing:.14em; }
  .stage { display:grid; grid-template-columns: 300px 1fr; gap:20px; align-items:end; }

  /* マタンと吹き出し */
  .guide { position:relative; }
  .bubble {
    position:relative; padding:16px 16px 17px; margin-bottom:10px;
    background:#fdfbf4; color:#201a2e; border:3px solid #201a2e;
    box-shadow: 5px 5px 0 rgba(0,0,0,.55); font-size:.6rem; line-height:2;
  }
  .bubble::after{ content:''; position:absolute; left:38px; bottom:-13px;
    border:7px solid transparent; border-top-color:#201a2e; }
  .bubble b { color:#7a2fbf; }
  .guide img { width:100%; display:block; filter: drop-shadow(0 0 18px rgba(122,47,191,.45)); }
  .nameplate { position:absolute; left:0; bottom:8px; padding:7px 12px;
    background:#7a2fbf; border:2px solid #c9a3ff; font-size:.52rem; color:#fff; }

  /* 選択肢 */
  .panel { padding:16px; min-height:430px; }
  .tabs { display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; }
  .tab { padding:10px 14px; font-size:.52rem; color:#8f88a6; border:2px solid #241d38;
         background:#100c1a; cursor:pointer; }
  .tab.on { color:#07060a; background:#ffcc4d; border-color:#ffcc4d; }
  .list { display:flex; flex-direction:column; gap:8px; }
  .row { display:flex; align-items:center; gap:14px; padding:14px 15px; cursor:pointer;
         border:2px solid #241d38; background:rgba(122,47,191,.06); }
  .row:hover { border-color:#ffcc4d; background:rgba(255,204,77,.09); }
  .row .n { color:#ffcc4d; font-size:.55rem; width:26px; }
  .row .ic { font-size:1.25rem; width:30px; text-align:center; }
  .row b { font-size:.62rem; color:#fff; letter-spacing:.06em; }
  .row small { display:block; margin-top:7px; color:#8f88a6; font-size:.58rem; }
  .row.holy { background:linear-gradient(90deg, rgba(255,204,77,.14), transparent); border-color:#5a4a1e; }
  .row.lock { opacity:.4; }
  @media(max-width:820px){ .stage{ grid-template-columns:1fr; } .guide{ display:none; } }
</style></head><body>
<div class="wrap">
  <div class="top"><h1>HEXA RELATION</h1></div>
  <div class="stage">
    <div class="guide">
      <div class="bubble jp">ようこそ。<br>いま <b>使えるサービス</b> は 4つ あります。<br>どれから 見ますか？</div>
      <img src="matan-point.png" alt="マタン">
      <div class="nameplate">MATAN</div>
    </div>

    <div class="panel frame">
      <div class="tabs">
        <div class="tab">PROFILE</div>
        <div class="tab on">PRODUCTS</div>
        <div class="tab">CONTACT</div>
      </div>
      <div class="list">
        <div class="row"><span class="n">01</span><span class="ic">💳</span><span><b>HEXA CARD</b><small class="jp">電子名刺</small></span></div>
        <div class="row"><span class="n">02</span><span class="ic">🌀</span><span><b>TOP3ANIME</b><small class="jp">すきなアニメ3選</small></span></div>
        <div class="row"><span class="n">03</span><span class="ic">📋</span><span><b>SPI CHECK</b><small class="jp">適性検査を無料診断</small></span></div>
        <div class="row holy"><span class="n">04</span><span class="ic">🕯</span><span><b>聴き宮</b><small class="jp">誰にも言えないことを、話す</small></span></div>
        <div class="row lock"><span class="n">--</span><span class="ic">🔒</span><span><b>カイロス</b><small class="jp">鋭意製作中</small></span></div>
      </div>
    </div>
  </div>
</div>
<p class="hintbar jp">タブで きりかえ　／　クリックで けってい</p>
</body></html>
