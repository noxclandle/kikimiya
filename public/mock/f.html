<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>案F 参道</title><link rel="stylesheet" href="shrine.css">
<style>
  body{ background:radial-gradient(120% 60% at 50% 0%, #2a1a22 0%, #150f16 45%, #0a070a 100%); }
  .sando{ max-width:860px; margin:0 auto; padding:34px 20px 84px; position:relative; }
  /* 中央の参道 */
  .path{ position:absolute; left:50%; top:0; bottom:0; width:560px; transform:translateX(-50%);
    background:repeating-linear-gradient(#221d22 0 42px, #1b171b 42px 44px);
    border-left:3px solid #000; border-right:3px solid #000; opacity:.9; }
  .inner{ position:relative; }
  .head{ text-align:center; margin-bottom:26px; }
  .head h1{ font-size:.82rem; color:var(--kin); letter-spacing:.16em; }
  .head p{ margin-top:12px; font-size:.5rem; color:#8a7f74; }

  .gate{ display:flex; flex-direction:column; align-items:center; margin:30px 0 16px; }
  .gate .torii{ --w:460px; --h:112px; }
  .gate .plate{ margin-top:-72px; z-index:2; padding:7px 16px; background:var(--sumi);
    border:3px solid var(--kin); color:var(--kin); font-size:.56rem; letter-spacing:.14em; }
  .gate .sub{ margin-top:11px; font-size:.6rem; color:#a2968a; }

  .row{ display:flex; justify-content:center; gap:16px; flex-wrap:wrap; margin:18px 0 6px; }
  /* 灯籠＝各サービス */
  .toro{ width:132px; cursor:pointer; text-align:center; transition:.16s; }
  .toro:hover{ transform:translateY(-6px); }
  .toro .roof{ height:0; border-left:66px solid transparent; border-right:66px solid transparent;
    border-bottom:22px solid #4a4048; filter:drop-shadow(0 -2px 0 #000); }
  .toro .box{ background:#2b2530; border:3px solid #000; padding:13px 6px 14px; }
  .toro .fire{ font-size:1.25rem; filter:drop-shadow(0 0 9px rgba(216,180,90,.85)); }
  .toro b{ display:block; margin-top:10px; font-size:.47rem; color:#f0e6d4; }
  .toro small{ display:block; margin-top:7px; font-size:.5rem; color:#9a8e82; }
  .toro .base{ height:9px; background:#3a333f; border:3px solid #000; border-top:none; }
  .toro.lock{ opacity:.36; }
  .toro.miya .box{ background:linear-gradient(#3a2a18,#241a10); border-color:#6b5327; }
  .toro.miya .fire{ filter:drop-shadow(0 0 16px rgba(216,180,90,1)); }

  .matan{ display:block; margin:26px auto 0; width:92px; }
  .say{ max-width:330px; margin:0 auto; background:var(--kinari); color:#241a12;
    border:3px solid #000; padding:12px 15px; font-size:.55rem; text-align:center;
    box-shadow:4px 4px 0 rgba(0,0,0,.6); }
</style></head><body>
<div class="sando">
  <div class="path"></div>
  <div class="inner">
    <div class="head">
      <h1>HEXA RELATION</h1>
      <p class="jp">ゲームの世界を、現実の武器に。</p>
    </div>

    <div class="gate">
      <div class="torii"><div class="kasagi"></div><div class="nuki"></div>
        <div class="legs"><div class="leg"></div><div class="leg"></div></div></div>
      <div class="plate">PROFILE</div>
      <div class="sub jp">この社のこと</div>
    </div>
    <div class="row">
      <div class="toro"><div class="roof"></div><div class="box"><div class="fire">🗃</div>
        <b>SAVE DATA</b><small class="jp">せいさく じっせき</small></div><div class="base"></div></div>
      <div class="toro"><div class="roof"></div><div class="box"><div class="fire">👾</div>
        <b>DEVELOPER</b><small class="jp">せいさくしゃ</small></div><div class="base"></div></div>
    </div>

    <div class="gate">
      <div class="torii"><div class="kasagi"></div><div class="nuki"></div>
        <div class="legs"><div class="leg"></div><div class="leg"></div></div></div>
      <div class="plate">PRODUCTS</div>
      <div class="sub jp">授かりもの</div>
    </div>
    <div class="row">
      <div class="toro"><div class="roof"></div><div class="box"><div class="fire">💳</div>
        <b>HEXA CARD</b><small class="jp">電子名刺</small></div><div class="base"></div></div>
      <div class="toro"><div class="roof"></div><div class="box"><div class="fire">🌀</div>
        <b>TOP3ANIME</b><small class="jp">アニメ3選</small></div><div class="base"></div></div>
      <div class="toro"><div class="roof"></div><div class="box"><div class="fire">📋</div>
        <b>SPI CHECK</b><small class="jp">適性検査</small></div><div class="base"></div></div>
      <div class="toro miya"><div class="roof"></div><div class="box"><div class="fire">🕯</div>
        <b>聴き宮</b><small class="jp">はなす ところ</small></div><div class="base"></div></div>
      <div class="toro lock"><div class="roof"></div><div class="box"><div class="fire">🔒</div>
        <b>カイロス</b><small class="jp">鋭意製作中</small></div><div class="base"></div></div>
    </div>

    <div class="gate">
      <div class="torii"><div class="kasagi"></div><div class="nuki"></div>
        <div class="legs"><div class="leg"></div><div class="leg"></div></div></div>
      <div class="plate">CONTACT</div>
      <div class="sub jp">社務所</div>
    </div>
    <div class="row">
      <div class="toro"><div class="roof"></div><div class="box"><div class="fire">🟢</div>
        <b>REQUEST</b><small class="jp">ご依頼・お見積り</small></div><div class="base"></div></div>
    </div>

    <img class="matan" src="matan-pixel.png" alt="マタン">
    <div class="say jp">ゆっくり 参って いってください</div>
  </div>
</div>
<p class="hintbar jp">鳥居を くぐって すすむ　／　灯籠を クリック</p>
</body></html>
